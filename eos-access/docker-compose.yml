# EOS Access
# Synology: Container Manager > Projekt > Erstellen > diesen Ordner als Pfad wählen.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: zugangsdaten.env
    ports:
      - "8321:8000" # im Heimnetz: http://192.168.86.250:8321
    volumes:
      - eos_data:/data # Datenbank (Personen, Protokoll) und Netatmo-Token
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 1m
      timeout: 5s

  # Zugang von außen: Tailscale Funnel gibt die App unter https://<TS_HOSTNAME>.<tailnet>.ts.net frei.
  # Erreichbar wird nur der Dienst "app", nicht das NAS. Ohne Schlüssel in tailscale.env wartet
  # dieser Container nur; die App im Heimnetz läuft unabhängig davon.
  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    env_file: tailscale.env
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true" # braucht keine besonderen Rechte auf dem NAS
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/funnel.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale:/config:ro

volumes:
  eos_data:
  tailscale_state:
